<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0818">
  <title>Timer</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <svg class="backdrop" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sun" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#ff2d78" />
        <stop offset="0.45" stop-color="#ff6a1f" />
        <stop offset="1" stop-color="#ffd23f" />
      </linearGradient>
      <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffc857" />
        <stop offset="1" stop-color="#ff3d5a" />
      </linearGradient>
      <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffb38a" />
        <stop offset="0.4" stop-color="#ff7ad9" />
        <stop offset="0.75" stop-color="#7b4dff" />
        <stop offset="1" stop-color="#2a1a6e" />
      </linearGradient>
      <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff7ad9" />
        <stop offset="0.5" stop-color="#ff8a3d" />
        <stop offset="1" stop-color="#7b4dff" />
      </linearGradient>
    </defs>
    <path fill="url(#sun)" stroke="rgb(255 255 255 / 0.35)" stroke-width="2" d="M-80 1080C40 760 120 420 380 180C470 96 590 70 640 130C690 190 640 260 560 330C380 490 300 760 260 1080Z" />
    <path fill="url(#ember)" opacity="0.9" d="M120 1080C200 820 300 600 470 430C540 360 620 330 650 370C680 410 640 460 580 510C460 610 380 820 360 1080Z" />
    <path fill="url(#iris)" d="M860 -60C900 160 1010 330 1200 400C1360 460 1520 430 1660 360L1660 520C1500 600 1300 620 1130 540C950 455 840 260 800 -60Z" />
    <path fill="none" stroke="rgb(255 255 255 / 0.5)" stroke-width="2" d="M860 -60C900 160 1010 330 1200 400C1360 460 1520 430 1660 360" />
    <ellipse fill="url(#orb)" cx="820" cy="560" rx="260" ry="210" />
    <ellipse fill="url(#sun)" opacity="0.55" cx="1380" cy="900" rx="220" ry="120" transform="rotate(-20 1380 900)" />
  </svg>

  <div class="desktop">
    <div class="top">
      <p id="status" class="status">READY...</p>
      <div class="arrows" aria-hidden="true">
        <span style="--i: 0"></span><span style="--i: 1"></span><span style="--i: 2"></span>
        <span style="--i: 3"></span><span style="--i: 4"></span><span style="--i: 5"></span>
      </div>
    </div>

    <div class="stack">
      <div class="window ghost ghost-2" aria-hidden="true"></div>
      <div class="window ghost ghost-1" aria-hidden="true"></div>
      <main class="window main">
        <header class="titlebar">
          <span class="dots"><i></i><i></i><i></i></span>
          <span class="name">Timer.exe</span>
          <button id="sound" class="sound" aria-label="Sound" aria-pressed="false">
            <svg viewBox="0 0 24 24">
              <path class="speaker" d="M3 9h4l5-4v14l-5-4H3z" />
              <path class="sound-on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" />
              <path class="sound-off" d="M16 9l6 6M22 9l-6 6" />
            </svg>
          </button>
        </header>
        <div class="content">
          <div class="dial">
            <svg viewBox="0 0 100 100" aria-hidden="true"><g id="ticks"></g></svg>
            <input id="time" class="time" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Minutes">
          </div>
          <div id="bar" class="bar" aria-hidden="true"></div>
          <div class="controls">
            <button id="toggle" aria-label="Start or pause">
              <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
              <svg class="icon-pause" viewBox="0 0 24 24"><path d="M7 5h3v14H7zm7 0h3v14h-3z" /></svg>
            </button>
            <button id="reset" aria-label="Reset">
              <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" /></svg>
            </button>
          </div>
        </div>
      </main>
    </div>

    <aside class="side" aria-hidden="true">
      <section class="window mood">
        <header class="titlebar">
          <span class="dots"><i></i><i></i><i></i></span>
          <span class="name">Mood</span>
        </header>
        <svg id="face" viewBox="0 0 13 13"></svg>
      </section>
      <div class="today">
        <div id="hearts" class="hearts"></div>
        <p>Today</p>
      </div>
    </aside>

    <p class="kanji" aria-hidden="true">時間</p>
  </div>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
