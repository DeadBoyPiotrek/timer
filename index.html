<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4ee6c8">
  <title>Timer</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="desktop">
    <div class="top">
      <p id="status" class="status">READY...</p>
      <div class="arrows" aria-hidden="true">
        <span style="--i: 0"></span><span style="--i: 1"></span><span style="--i: 2"></span>
        <span style="--i: 3"></span><span style="--i: 4"></span><span style="--i: 5"></span>
      </div>
    </div>

    <div class="stack">
      <div class="window ghost ghost-2" aria-hidden="true"></div>
      <div class="window ghost ghost-1" aria-hidden="true"></div>
      <main class="window main">
        <header class="titlebar">
          <span class="dots"><i></i><i></i><i></i></span>
          <span class="name">Timer.exe</span>
          <button id="sound" class="sound" aria-label="Sound" aria-pressed="false">
            <svg viewBox="0 0 24 24">
              <path class="speaker" d="M3 9h4l5-4v14l-5-4H3z" />
              <path class="sound-on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" />
              <path class="sound-off" d="M16 9l6 6M22 9l-6 6" />
            </svg>
          </button>
        </header>
        <div class="content">
          <div class="dial">
            <svg viewBox="0 0 100 100" aria-hidden="true"><g id="ticks"></g></svg>
            <input id="time" class="time" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Minutes">
          </div>
          <div id="bar" class="bar" aria-hidden="true"></div>
          <div class="controls">
            <button id="toggle" aria-label="Start or pause">
              <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
              <svg class="icon-pause" viewBox="0 0 24 24"><path d="M7 5h3v14H7zm7 0h3v14h-3z" /></svg>
            </button>
            <button id="reset" aria-label="Reset">
              <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" /></svg>
            </button>
          </div>
        </div>
      </main>
    </div>

    <aside class="side" aria-hidden="true">
      <section class="window mood">
        <header class="titlebar yellow">
          <span class="dots"><i></i><i></i><i></i></span>
          <span class="name">Mood</span>
        </header>
        <svg id="face" viewBox="0 0 13 13"></svg>
      </section>
      <div class="today">
        <div id="hearts" class="hearts"></div>
        <p>Today</p>
      </div>
    </aside>

    <p class="kanji" aria-hidden="true">時間</p>
  </div>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
